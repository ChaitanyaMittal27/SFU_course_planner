plugins {
    id 'org.springframework.boot' version '3.0.0'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // PostgreSQL Driver
    implementation 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // Resend email SDK
    implementation 'com.resend:resend-java:3.1.0'
    // Generated OpenAPI specification and Swagger UI (Spring Boot 3.0 compatible)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
    // testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Ensure bootJar is enabled
tasks.named('bootJar') {
    enabled = true
}

tasks.register('rmpManual', JavaExec) {
    group = 'verification'
    description = 'Run the interactive Rate My Professors client check.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.courseplanner.service.ManualRateMyProfessorsClientRunner'
    standardInput = System.in
}

// Make sure main class is specified
bootJar {
    mainClass = 'com.example.courseplanner.Application'
}
